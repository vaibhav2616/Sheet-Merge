name: CI Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Apps Script JS Syntax
        run: |
          for file in src/*.js; do
            echo "Checking $file..."
            node --check "$file"
          done

      - name: Validate Apps Script Manifest JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8')); console.log('appsscript.json is valid JSON.');"
