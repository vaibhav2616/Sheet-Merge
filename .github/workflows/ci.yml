name: CI Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Apps Script JS Syntax
        run: |
          for file in src/*.js; do
            echo "Checking $file..."
            node --check "$file"
          done

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Run JavaScript Virtual Scenario Tests (Jest)
        run: npm test

      - name: Validate Apps Script Manifest JSON
        run: |
          python3 -c "import json; json.load(open('appsscript.json'))"
          echo "appsscript.json is valid JSON."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Test Suite
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx email-validator dnspython

      - name: Validate Python Syntax
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/poll_gmail.py
          python -m py_compile backend/smtp_relay.py
          python -m py_compile backend/domain_security.py
          python -m py_compile backend/spam_analyzer.py
          echo "Python backend files compile successfully."

      - name: Run Python Backend Virtual Scenario Tests (Pytest)
        run: |
          python -m pytest backend/tests -v
